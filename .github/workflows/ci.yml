name: CI

on:
  push:
  pull_request:

jobs:
  ml:
    name: ml + api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev,api]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy
      - name: Test
        # Runs entirely against tests/fixtures; never contacts the NASA archive.
        run: pytest --cov=exodiscover --cov-report=term-missing

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Test
        run: npm run test
      - name: Build
        run: npx vite build
