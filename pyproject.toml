[project]
name = "exodiscover"
version = "0.1.0"
description = "Leakage-free exoplanet classification over NASA Kepler, TESS, and K2 catalogs."
requires-python = ">=3.11,<3.13"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.5",
  "xgboost>=2.1",
  "lightgbm>=4.5",
  "catboost>=1.2",
  "optuna>=4.0",
  "shap>=0.46",
  "matplotlib>=3.9",
  "typer>=0.12",
  "pydantic-settings>=2.4",
  "requests>=2.32",
  "joblib>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
exo = "exodiscover.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["ml"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["web", "backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PTH"]

[tool.ruff.lint.isort]
known-first-party = ["exodiscover"]

[tool.ruff.lint.per-file-ignores]
# Typer and FastAPI both declare parameters as `x: T = Marker(...)` in the
# signature; B008 flags the idiom itself, not a mistake.
"ml/exodiscover/cli.py" = ["B008"]
"api/main.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
packages = ["exodiscover"]
mypy_path = "ml"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::UserWarning", "ignore::FutureWarning"]
